name: Start a container
inputs:
  container:
    description: Container image (empty = do nothing)
    required: false
    default: ""
  wrapped-shell:
    description: Shell in the container to wrap
    required: false
    default: /bin/sh -e
  wrapper-name:
    description: Wrapper name
    required: true
runs:
  using: composite
  steps:
    - name: Containerize
      if: inputs.container != ''
      shell: bash
      env:
        CONTAINER: ${{ inputs.container }}
        WRAPPER: ${{ inputs.wrapper-name }}
        WRAPPED_SHELL: ${{ inputs.wrapped-shell }}
      run: |
        containerName="$WRAPPER-${{ github.run_id }}-${{ github.job }}"

        # Where Github Actions puts per-step files:
        # $GITHUB_ENV, $GITHUB_OUTPUT, $GITHUB_PATH, $GITHUB_STEP_SUMMARY
        ghStepDir="$RUNNER_TEMP/_runner_file_commands"

        podman run -d --rm \
          --name "$containerName" \
          --userns=keep-id \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          -w "$GITHUB_WORKSPACE" \
          -v "$ghStepDir:$ghStepDir" \
          "$CONTAINER" sleep infinity

        dir="$RUNNER_TEMP/$WRAPPER"
        mkdir -p "$dir"
        cat > "$dir/$WRAPPER" <<EOF
        #!/usr/bin/env bash
        args=()
        while IFS= read -r envVar; do
          case "\$envVar" in
            HOME|PWD|OLDPWD|PATH|SHLVL|_) ;;
            *) args+=(-e "\$envVar") ;;
          esac
        done < <(compgen -e)
        exec podman exec -i "\${args[@]}" --workdir "\$PWD" "$containerName" $WRAPPED_SHELL < "\$1"
        EOF

        chmod +x "$dir/$WRAPPER"
        echo "$dir" >> "$GITHUB_PATH"
