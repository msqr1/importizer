name: Publish artifacts to release
on:
  workflow_call:
    inputs:
      platforms:
        description: Expected platforms
        type: string
        required: true
      tag:
        description: Release's tag to publish to
        type: string
        required: true
jobs:
  all:
    permissions:
      contents: write
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          merge-multiple: true
          path: dists
