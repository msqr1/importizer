name: Make Alpine Linux Images
on: workflow_dispatch
concurrency:
  group: CI-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    outputs:
      platforms: ${{ steps.get.outputs.platforms }}
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get outputs
        id: get
        run: |
          echo "platforms=$(gh api repos/${{ github.repository }}/contents/Platforms.json \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          -H "Accept: application/vnd.github.raw+json" \
          -q 'map(select(.os == "linux"))')" >> "$GITHUB_OUTPUT"
  make:
    needs: prepare
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }}
    steps:
      - name: all
        run: |
          repo="${{ github.repository }}"

          podman build \
            https://raw.githubusercontent.com/$repo/${{ github.sha }}/scripts/alpine/Containerfile \
            --platform linux/${{ matrix.arch }} \
            -t img

          echo ${{ github.token }} | \
            podman login ghcr.io -u ${{ github.actor }} --password-stdin

          podman push img ${{ matrix.container }} \
            -f oci \
            --compression-format zstd \
            --compression-level 19

          podman logout --all
