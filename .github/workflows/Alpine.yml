name: Make Alpine Images
on: workflow_dispatch
concurrency:
  group: CI-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get platforms
        id: platforms
        run: |
          echo "platforms=$(gh api repos/{owner}/{repo}/contents/Platforms.json \
          -H "Accept: application/vnd.github.raw+json" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          -q 'map(select(.os == "linux"))')" >> "$GITHUB_OUTPUT"
  make:
    needs: prepare
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }}
    steps:
      - name: all
        run: |
          repo=${{ github.repository }}

          podman build \
            https://raw.githubusercontent.com/$repo/${{ github.sha }}/scripts/alpine/Containerfile \
            --platform linux/${{ matrix.arch }} \
            -t img

          podman login ghcr.io \
            -u msqr1 \
            -p ${{ github.token }}

          podman push img \
            ghcr.io/$repo-alpine:3.24.2-${{ matrix.arch }} \
            -f oci \
            --compression-format zstd \
            --compression-level 19

          podman logout --all
