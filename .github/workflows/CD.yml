name: Tag Release
on: workflow_dispatch
jobs:
  all:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publishability check
        run: |
          # No releases from other branches
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            exit 1
          fi

          # Latest CI run must be successful so we can grab release builds from there
          CIPassed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/CI.yml/runs?branch=main" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Accept: application/vnd.github+json" \
            -q '.total_count > 0 and .workflow_runs[0].conclusion == "success"')
          if ! $CIPassed; then
            exit 1
          fi
      - name: Download and rename distributions
        run: |
          gh release download continuous -p "importizer-release-*" -D dists -R "$GITHUB_REPOSITORY"
          find dists/* -maxdepth 1 -exec bash -c 'for f; do mv "$f" "${f/release-/}"; done' _ {} +
      - name: Publish release
        run: |
          v=3.0.0
          gh release create $v dists/* \
            -d \
            -t $v \
            -n "[Change log](https://github.com/$GITHUB_REPOSITORY/blob/main/ChangeLog.adoc#${v//./-})" \
            -R "$GITHUB_REPOSITORY"
