name: Prepare for multi-platform CI/CD
on:
  workflow_call:
    inputs:
      checkCI:
        description: Check CI status of HEAD
        type: boolean
        default: false
      checkCXX:
        description: Check format and lint for C++
        type: boolean
        default: false
      jqExpr:
        description: jq platform filter expression
        type: string
        default: .
    outputs:
      platforms:
        description: Platforms
        value: ${{ jobs.all.outputs.platforms }}
jobs:
  all:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    outputs:
      platforms: ${{ steps.getPlatforms.outputs.platform }}
    env:
      GH_TOKEN: ${{ github.token }}
      repo: ${{ github.repository }}
    steps:
      - name: Check CI status of HEAD
        if: inputs.checkCI == 'true'
        run: |
          "$(gh api repos/$repo/actions/workflows/CI.yml/runs?head_sha=${{ github.sha }} \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -q '(.total_count > 0 and .workflow_runs[0].conclusion != "success")')" &&
            exit 1
      - name: Checkout
        if: inputs.checkCXX == 'true'
        uses: taiki-e/checkout-action@v1.4.2
      - name: Check format and lint for C++
        if: inputs.checkCXX == 'true'
        run: |
          find src -name "*.cc" -o -name "*.hh" | \
            xargs -P 0 -I {} clang-format-22 --dry-run --Werror {}
          cmake -B build -DCMAKE_BUILD_TYPE=Debug --preset importizer
          run-clang-tidy-22 -p build -j 0 src -quiet
      - name: Get platforms
        id: getPlatforms
        run: |
          if [ ${{ inputs.checkCXX }} ]; then
            echo "platforms=$(cat Platforms.json | jq '${{ inputs.jqExpr }}')" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=$(gh api repos/$repo/contents/Platforms.json \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -q '${{ inputs.jqExpr }}')" >> "$GITHUB_OUTPUT"
          fi
