name: Prepare for multi-platform CI/CD
on:
  workflow_call:
    inputs:
      checkCI:
        description: Check CI status of HEAD
        type: boolean
        default: false
      jqExpr:
        description: jq job filter expression
        type: string
        default: .
    outputs:
      platforms:
        description: Platforms
        value: ${{ jobs.all.outputs.platfoms }}
jobs:
  all:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    outputs:
      platforms: ${{ steps.getPlatforms.output.platforms }}
    env:
      GH_TOKEN: ${{ github.token }}
      repo: repos/${{ github.repository }}
    steps:
      - name: Check CI status of HEAD
        if: inputs.checkCi == 'true'
        run: |
          "$(gh api $repo/actions/workflows/Ci.yml/runs?head_sha=${{ github.sha }} \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          -q '(.total_count > 0 and .workflow_runs[0].conclusion != "success")')" &&
          exit 1
      - name: C++ format check
        run: |
      - name: C++ lint check
        run: |
      - name: Get platforms
        id: getPlatforms
        run: |
          echo "platforms=$(gh api $repo/contents/Platforms.json \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -q '${{ inputs.jqExpr }}')" >> "$GITHUB_OUTPUT"
