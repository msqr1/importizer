name: Tag Continuous
on: [push, workflow_dispatch]
jobs:
  prepare:
    uses: ./.github/workflows/Prepare.yml
    with:
      checkCXX: true
  all:
    permissions:
      contents: write
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.os }}-${{ matrix.arch }}
    container: ${{ matrix.container || '' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # 1.4.2
      - name: Setup environment
        run: . scripts/setup/${{ matrix.setup }} ${{ matrix.arch }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=TRUE --preset importizer
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build/tests -C Debug -j
      - name: Make distribution
        run: cmake -DTYPE=Debug -DBUILD_DIR=build -P scripts/MkDist.cmake
