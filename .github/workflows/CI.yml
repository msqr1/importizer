name: Tag Continuous
on:
  push:
  workflow_dispatch:
    inputs:
      jqExpr:
        description: Override JQ expression
concurrency:
  group: CI-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max
env:
  REPO: ${{ github.repository }}
jobs:
  prepare:
    outputs:
      platforms: ${{ steps.get.outputs.platforms }}
      shouldPublish: ${{ steps.get.outputs.shouldPublish }}

    # Windows ARM64 is the one that:
    # 1. Have jq, clang-format, clang-tidy
    # 2. Is the fastest runner
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Checkout
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - name: Setup
        run: . scripts/setup/Windows.ps1
      - name: Configure (for linting)
        run: cmake -B build --preset lint
      - name: Lint
        run: echo "TODO"
      - name: Get outputs
        id: get
        env:
          # jq platform filter expression
          JQ_EXPR: ${{ inputs.jqExpr || '.' }}
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "$JQ_EXPR" != "." ]; then
              exit 1
            fi
            echo "shouldPublish=true" >> "$GITHUB_OUTPUT"
          else
            echo "shouldPublish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "platforms=$(jq -c "$JQ_EXPR" < Platforms.json)" >> "$GITHUB_OUTPUT"
  make:
    permissions:
      contents: write
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    name: ${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # 1.4.2
      - name: Setup
        run: . scripts/setup/${{ matrix.setup }} ${{ matrix.arch }}
      - name: Start container
        uses: ./.github/actions/start-container
        with:
          container: ${{ matrix.container || '' }}
          wrapper-name: container-sh

      - name: &configure1 Configure (for building)
        if: matrix.container
        shell: container-sh {0}
        env: &configure2
          GH_TOKEN: ${{ github.token }}
        run: &configure3 |
          cmake -B build --preset build
      - name: *configure1
        if: "!matrix.container"
        env: *configure2
        run: *configure3

      - name: &debug1 Build and test (Debug)
        if: matrix.container
        shell: container-sh {0}
        run: &debug2 |
          cmake --build build --config Debug
          ctest --test-dir build/tests -C Debug --progress --output-on-failure --schedule-random -j
      - name: *debug1
        if: "!matrix.container"
        run: *debug2

      - name: &release1 Build and test (Release)
        if: matrix.container
        shell: container-sh {0}
        run: &release2 |
          cmake --build build --config Release
          ctest --test-dir build/tests -C Release --progress --output-on-failure --schedule-random -j
      - name: *release1
        if: "!matrix.container"
        run: *release2

      - name: &dist1 Make distributions
        if: matrix.container
        shell: container-sh {0}
        run: &dist2 |
          cmake -DTYPE=Debug -DBUILD_DIR=build -DOUT_DIR=dists -P scripts/MkDist.cmake
          cmake -DTYPE=Release -DBUILD_DIR=build -DOUT_DIR=dists -P scripts/MkDist.cmake
      - name: *dist1
        if: "!matrix.container"
        run: *dist2

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          # If we upload the directory, unarchiving results in a directory, but we want the files
          path: dists/*

          name: importizer-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [make, prepare]
    if: needs.prepare.outputs.shouldPublish == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download distributions
        run: gh run download ${{ github.run_id }} -D dists -R "$REPO"
      - name: Publish distributions
        run: gh release upload continuous dists/*/* --clobber -R "$REPO"
      - name: Move tag
        run: |
          gh api "repos/$REPO/git/refs/tags/continuous" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --method PATCH \
            -f sha=${{ github.sha }} \
            -F force=true
