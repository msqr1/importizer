name: Tag Continuous
on: [push, workflow_dispatch]
concurrency:
  group: CI-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    outputs:
      platforms: ${{ steps.get.outputs.platforms }}
      shouldPublish: ${{ steps.get.outputs.shouldPublish }}

    # Windows ARM64 is the one that:
    # 1. Have jq, clang-format, clang-tidy
    # 2. Is the fastest runner
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Checkout
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - name: Setup
        run: . scripts/setup/Windows.ps1
      - name: Configure
        run: cmake -B build --preset CI
      - name: Code quality check
        run: echo "TODO"
      - name: Get outputs
        id: get
        env:
          # jq platform filter expression
          JQ_EXPR: map(select(.os == "linux" or (.os == "macos" and .arch == "arm64")))
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "$JQ_EXPR" != "." ]; then
              exit 1
            fi
            echo "shouldPublish=true" >> "$GITHUB_OUTPUT"
          else
            echo "shouldPublish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "platforms=$(jq -c "$JQ_EXPR" < Platforms.json)" >> "$GITHUB_OUTPUT"
  make:
    permissions:
      contents: write
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.os }}-${{ matrix.arch }}
    container: ${{ matrix.container || '' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # 1.4.2
      - name: Setup
        run: . scripts/setup/${{ matrix.setup }} ${{ matrix.arch }}
      - name: Configure
        run: cmake -B build --preset CI
      - name: Build and test (Debug)
        run: |
          cmake --build build --config Debug
          ctest --test-dir build/tests -C Debug -j
      - name: Build and test (Release)
        run: |
          cmake --build build --config Release
          ctest --test-dir build/tests -C Release -j
      - name: Make distributions
        run: |
          cmake -DTYPE=Debug -DBUILD_DIR=build -DOUT_DIR=dists -P scripts/MkDist.cmake
          cmake -DTYPE=Release -DBUILD_DIR=build -DOUT_DIR=dists -P scripts/MkDist.cmake
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: importizer-${{ matrix.os }}-${{ matrix.arch }}

          # If we upload the directory, unarchiving results in a directory, but we want the files
          path: dists/*

          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [make, prepare]
    if: needs.prepare.outputs.shouldPublish == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          merge-multiple: true
          path: dists
      - name: Publish distributions
        run: gh release upload continuous dists/* --clobber
      - name: Move tag
        run: |
          gh api repos/${{ github.repository }}/git/refs/tags/continuous \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --method PATCH \
            -f sha=${{ github.sha }} \
            -F force=true
